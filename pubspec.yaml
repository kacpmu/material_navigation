name: material_navigation
description: >-
  Material 3 Expressive navigation for Flutter: a navigation bar with vertical
  or horizontal items, and a navigation rail that expands in place or as a
  modal.
version: 0.2.0
repository: https://github.com/kacpmu/material_navigation

topics:
  - navigation
  - material
  - expressive
  - ui
  - widgets

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
